name: Update Market Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update-market-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update market signal JSON
        run: node scripts/update-market-signals.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-signals.json
          if git diff --cached --quiet; then
            echo "No market signal changes to commit."
          else
            git commit -m "Update market signal data"
            git push
          fi
